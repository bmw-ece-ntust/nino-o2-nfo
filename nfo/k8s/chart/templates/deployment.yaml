apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nfo.fullname" . }}
  labels:
    {{- include "nfo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nfo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nfo.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: nfo
        command: ["/bin/sh", "-c"]
        args:
          - |
            python manage.py migrate --noinput &&
            gunicorn nfo_microservice.wsgi:application --bind 0.0.0.0:8000 --workers 2
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        {{- range .Values.env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "nfo.fullname" . }}
              key: secret-key
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: {{ include "nfo.fullname" . }}
              key: debug
        - name: ALLOWED_HOSTS
          valueFrom:
            configMapKeyRef:
              name: {{ include "nfo.fullname" . }}
              key: allowed-hosts
        volumeMounts:
        {{- if .Values.persistence.enabled }}
        - name: data
          mountPath: {{ .Values.persistence.mountPath }}
        {{- end }}
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: kubeconfig
          mountPath: /root/.kube
          readOnly: true
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /api/kubernetes-clusters/
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/kubernetes-clusters/
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      {{- if .Values.persistence.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "nfo.fullname" . }}
      {{- end }}
      - name: config
        configMap:
          name: {{ include "nfo.fullname" . }}-config
      - name: kubeconfig
        secret:
          secretName: nfo-kubeconfig
